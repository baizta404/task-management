<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Task</title>
</head>
<body>
    <div>
        <h4>Tasks in terms of priority</h4>
        <ul>
            {% for task in priority_tasks  %}
            <li>
                {{task.task.title}}
            </li>
            <p>Priority : {{task.priority}} </p>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
